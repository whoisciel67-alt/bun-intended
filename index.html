<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bun intended</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        
        <header class="topbar">
            <a class="brand" href="#" aria-label="Bun Intended home">
                BUN <span>INTENDED</span>
            </a>
            <span class="top-note">A LITTLE BAKERY SIMULATOR</span>
        </header>

        <!--title screen-->
        <section id="titleScreen" class="title-screen">
            <div class="title-art">
                <div class="sun"></div>

                <div class="title-window"></div>
                <div class="window-cross"></div>
                <div class="window-glow"></div>
            </div>

            <div class="title-counter">
                <span class="bread bread-one"></span>
                <span class="bread bread-two"></span>
                <span class="plant">✿</span>
            </div>

            <p class="eyebrow">FRESHLY BASED, SLOWLY</p>
            <h1>
                <p class="intro">
                    A tiny bakery, a sleepy little town,<br>
                    and plenty of room for something sweet.
                </p>
            </h1>

            <div class="menu-buttons">
                <button id="newGameButton" class="button primary">NEW GAME</button>
                <button id="newGameButton" class="button secondary">CONTINUE</button>
                <button id="newGameButton" class="text-button">HOW TO PLAY</button>
            </div>

            <p class="tiny-note">A cozy little work in progress ♡</p>
        </section>

        <!--main game screen-->
        <section id="gameScreen" class="screen game-screen hidden">

        </section>

    </main>
    
    <!--general dialogue window-->
    <div id="dialogueModal" class="modal hidden" role="dialog" aria-modal="true">


    </div>

    <!--how to play window-->
    <div id="howModal" class="modal hidden" role="dialog" aria-modal="true">


    </div>

    <!--inventory window-->
    <div id="inventoryModal" class="modal hidden" role="dialog" aria-modal="true">


    </div>

    <!--end of day window-->
    <div id="dayModal" class="modal hidden" role="dialog" aria-modal="true">


    </div>

    <!--pause window-->
    <div id="pauseModal" class="modal hiddden" role="dialog" aria-modal="true">


    </div>

    
    <!--script.js-->
    <script src="script.js"></script>

</body>
</html>
